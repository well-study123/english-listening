<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语逐句听力练习</title>
<style>
 .word {
  cursor: pointer;
  border-radius: 3px;
  transition: background .15s;
}
.word:hover {
  background: #4ecca3;
  color: #1a1a2e;
}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #1a1a2e; color: #eaeaea;
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }
  header {
    padding: 10px 16px; background: #16213e;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin-right: auto; color: #4ecca3; }
  .file-btn {
    background: #0f3460; color: #eaeaea; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
    border: 1px solid #4ecca3; transition: .2s;
  }
  .file-btn:hover { background: #4ecca3; color: #1a1a2e; }
  input[type=file] { display: none; }

  main { flex: 1; display: flex; overflow: hidden; }

  /* 左侧视频区 */
  .left {
    flex: 1.2; display: flex; flex-direction: column;
    background: #000; position: relative;
  }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  /* 右侧字幕区 */
  .right {
    flex: 1; display: flex; flex-direction: column;
    background: #16213e; border-left: 1px solid #0f3460;
  }
  .subtitle-list {
    flex: 1; overflow-y: auto; padding: 8px;
  }
  .subtitle-list::-webkit-scrollbar { width: 8px; }
  .subtitle-list::-webkit-scrollbar-thumb {
    background: #4ecca3; border-radius: 4px;
  }
  .line {
    padding: 10px 14px; margin-bottom: 6px; border-radius: 8px;
    cursor: pointer; font-size: 15px; line-height: 1.5;
    border-left: 3px solid transparent; transition: .15s;
  }
  .line:hover { background: #0f3460; }
  .line.active {
    background: #0f3460; border-left-color: #4ecca3;
    color: #4ecca3; font-weight: 600;
  }
  .line .time { font-size: 11px; color: #666; margin-right: 8px; }
  .line.active .time { color: #4ecca3; }

  /* 底部控制栏 */
  .controls {
    padding: 10px 16px; background: #0f3460;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border-top: 1px solid #16213e;
  }
  .controls button {
    background: #16213e; color: #eaeaea; border: 1px solid #4ecca3;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-size: 13px; transition: .2s;
  }
  .controls button:hover { background: #4ecca3; color: #1a1a2e; }
  .controls button.on { background: #4ecca3; color: #1a1a2e; }
  .controls label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .controls input[type=range] { width: 120px; }
  .status { font-size: 12px; color: #888; margin-left: auto; }

  /* 空状态 */
  .empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; color: #666; gap: 10px;
    text-align: center; padding: 20px;
  }
  .empty p { font-size: 14px; line-height: 1.8; }
  .empty code {
    background: #0f3460; padding: 2px 6px; border-radius: 4px;
    color: #4ecca3; font-size: 12px;
  }
   /* ===== 可点击单词 ===== */
  .word {
    cursor: pointer;
    border-radius: 3px;
    transition: background .15s;
  }
  .word:hover {
    background: #4ecca3;
    color: #1a1a2e;
  }

  /* ===== 查词弹窗 ===== */
  .dict-popup {
    position: fixed; right: 20px; bottom: 80px;
    width: 320px; max-height: 50vh; overflow-y: auto;
    background: #16213e; border: 1px solid #4ecca3;
    border-radius: 10px; padding: 14px; display: none;
    z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .dict-popup.show { display: block; }
  .dict-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px; font-size: 18px; color: #4ecca3;
  }
  .dict-header #dictWord { font-weight: 700; }
  .dict-header #dictPhonetic { font-size: 13px; color: #888; }
  .dict-header button {
    margin-left: auto; background: none; border: none;
    color: #888; cursor: pointer; font-size: 16px;
  }
  .dict-body { font-size: 13px; line-height: 1.6; color: #ccc; }
  .dict-body .pos { color: #4ecca3; font-weight: 600; }
  .dict-body .def { margin-bottom: 8px; }
  .dict-body .example { color: #999; font-style: italic; font-size: 12px; }
  .add-btn {
    margin-top: 12px; width: 100%; padding: 8px;
    background: #0f3460; color: #4ecca3;
    border: 1px solid #4ecca3; border-radius: 6px;
    cursor: pointer; font-size: 13px;
  }
  .add-btn:hover { background: #4ecca3; color: #1a1a2e; }

  /* ===== 生词本面板 ===== */
  .vocab-panel {
    position: fixed; left: 20px; bottom: 80px;
    width: 340px; max-height: 60vh; overflow-y: auto;
    background: #16213e; border: 1px solid #4ecca3;
    border-radius: 10px; padding: 14px; display: none;
    z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .vocab-panel.show { display: block; }
  .vocab-header {
    display: flex; align-items: center;
    margin-bottom: 10px; color: #4ecca3;
  }
  .vocab-header h3 { font-size: 15px; margin-right: auto; }
  .vocab-header button {
    background: none; border: none; color: #888;
    cursor: pointer; font-size: 16px;
  }
  .vocab-list .vocab-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px; border-bottom: 1px solid #0f3460;
    font-size: 14px;
  }
  .vocab-list .vocab-item .v-word { color: #4ecca3; font-weight: 600; }
  .vocab-list .vocab-item .v-def {
    color: #999; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .vocab-list .vocab-item .v-del {
    margin-left: auto; background: none; border: none;
    color: #666; cursor: pointer; font-size: 14px;
  }
  .vocab-list .vocab-item .v-del:hover { color: #e94560; }
</style>
</head>
<body>

<header>
  <h1>🎧 英语逐句听力</h1>
  <label class="file-btn">📹 选择视频
    <input type="file" id="videoFile" accept="video/*">
  </label>
  <label class="file-btn">📝 选择字幕(.srt/.vtt)
    <input type="file" id="subFile" accept=".srt,.vtt,text/plain">
  </label>
</header>

<main>
  <div class="left">
    <video id="video" controls></video>
  </div>
  <div class="right">
    <div class="subtitle-list" id="subtitleList">
      <div class="empty">
        <p>👆 请先选择视频和字幕文件</p>
        <p>字幕格式支持 <code>.srt</code> 或 <code>.vtt</code></p>
        <p>点击句子即可逐句播放</p>
      </div>
    </div>
  </div>
</main>

<div class="controls">
  <button id="prevBtn">◀ 上一句</button>
  <button id="nextBtn">下一句 ▶</button>
  <button id="repeatBtn">🔁 单句循环</button>
  <button id="playBtn">▶ 播放</button>
  <label>语速
    <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1">
    <span id="speedVal">1.0x</span>
  </label>
  <span class="status" id="status">就绪</span>
</div>
<!-- 查词弹窗 -->
<div id="dictPopup" class="dict-popup">
  <div class="dict-header">
    <span id="dictWord">word</span>
    <span id="dictPhonetic"></span>
    <button id="dictClose">✕</button>
  </div>
  <div id="dictBody" class="dict-body">加载中...</div>
  <button id="addToVocab" class="add-btn">＋ 加入生词本</button>
</div>

<!-- 生词本面板 -->
<div id="vocabPanel" class="vocab-panel">
  <div class="vocab-header">
    <h3>📚 生词本 (<span id="vocabCount">0</span>)</h3>
    <button id="vocabClose">✕</button>
  </div>
  <div id="vocabList" class="vocab-list"></div>
</div>
<script>
/* ============ 全局状态 ============ */
const video = document.getElementById('video');
const subtitleList = document.getElementById('subtitleList');
const statusEl = document.getElementById('status');
const repeatBtn = document.getElementById('repeatBtn');
const playBtn = document.getElementById('playBtn');
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');

let subtitles = [];      // [{start, end, text}, ...]
let activeIndex = -1;    // 当前句索引
let isRepeat = false;    // 单句循环
let currentSentenceEnd = null; // 循环时使用

/* ============ 字幕解析 ============ */
function parseTime(str) {
  // 支持 00:00:01,000 或 00:00:01.000
  const parts = str.trim().replace(',', '.').split(':');
  let h = 0, m = 0, s = 0;
  if (parts.length === 3) {
    h = parseFloat(parts[0]); m = parseFloat(parts[1]); s = parseFloat(parts[2]);
  } else if (parts.length === 2) {
    m = parseFloat(parts[0]); s = parseFloat(parts[1]);
  } else {
    s = parseFloat(parts[0]);
  }
  return h * 3600 + m * 60 + s;
}

function parseSRT(text) {
  const result = [];
  // 统一换行
  const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\n+/);
  for (const block of blocks) {
    const lines = block.split('\n').filter(l => l.trim() !== '');
    if (lines.length < 2) continue;
    // 找到包含 --> 的行
    let timeLineIdx = lines.findIndex(l => l.includes('-->'));
    if (timeLineIdx === -1) continue;
    const timeLine = lines[timeLineIdx];
    const [startStr, endStr] = timeLine.split('-->').map(s => s.trim());
    const start = parseTime(startStr);
    const end = parseTime(endStr.split(' ')[0]);
    const textContent = lines.slice(timeLineIdx + 1).join(' ').trim();
    if (!textContent) continue;
    result.push({ start, end, text: textContent });
  }
  // 按开始时间排序
  result.sort((a, b) => a.start - b.start);
  return result;
}

/* ============ 渲染字幕列表 ============ */
function renderSubtitles() {
 /* ============ 把句子拆成可点击单词 ============ */
function wrapWords(text) {
  // 先转义 HTML 防止注入
  const escaped = escapeHtml(text);
  // 用正则匹配英文单词（含连字符和撇号），其余字符原样保留
  return escaped.replace(/[A-Za-z][A-Za-z'\-]*/g, (word) => {
    return `<span class="word" data-word="${word.toLowerCase()}">${word}</span>`;
  });
}

function renderSubtitles() {
  subtitleList.innerHTML = '';
  if (subtitles.length === 0) {
    subtitleList.innerHTML = '<div class="empty"><p>字幕为空</p></div>';
    return;
  }
  subtitles.forEach((sub, i) => {
    const div = document.createElement('div');
    div.className = 'line';
    div.dataset.index = i;
    div.innerHTML = `<span class="time">${formatTime(sub.start)}</span>${wrapWords(sub.text)}`;
    // 注意：这里不再给整行绑点击，改到容器上做事件委托，见下一步
    subtitleList.appendChild(div);
  });
}
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

/* ============ 逐句播放核心 ============ */
function playSentence(index) {
  if (index < 0 || index >= subtitles.length) return;
  activeIndex = index;
  const sub = subtitles[index];
  currentSentenceEnd = sub.end;
  video.currentTime = sub.start;
  video.play();
  updateActiveHighlight();
  statusEl.textContent = `第 ${index + 1} / ${subtitles.length} 句`;
}

function updateActiveHighlight() {
  document.querySelectorAll('.line').forEach(el => {
    const i = parseInt(el.dataset.index);
    el.classList.toggle('active', i === activeIndex);
  });
  const activeEl = document.querySelector('.line.active');
  if (activeEl) {
    activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

/* ============ 时间更新监听（循环 + 自动高亮） ============ */
video.addEventListener('timeupdate', () => {
  const t = video.currentTime;

  // 单句循环
  if (isRepeat && currentSentenceEnd !== null && t >= currentSentenceEnd) {
    video.currentTime = subtitles[activeIndex].start;
    return;
  }

  // 自动高亮当前句（非循环时）
  if (!isRepeat && subtitles.length > 0) {
    let idx = -1;
    for (let i = 0; i < subtitles.length; i++) {
      if (t >= subtitles[i].start && t < subtitles[i].end) {
        idx = i; break;
      }
    }
    if (idx !== -1 && idx !== activeIndex) {
      activeIndex = idx;
      currentSentenceEnd = subtitles[idx].end;
      updateActiveHighlight();
      statusEl.textContent = `第 ${idx + 1} / ${subtitles.length} 句`;
    }
  }
});

/* ============ 按钮事件 ============ */
document.getElementById('prevBtn').addEventListener('click', () => {
  if (activeIndex > 0) playSentence(activeIndex - 1);
  else playSentence(0);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (activeIndex < subtitles.length - 1) playSentence(activeIndex + 1);
});

repeatBtn.addEventListener('click', () => {
  isRepeat = !isRepeat;
  repeatBtn.classList.toggle('on', isRepeat);
  statusEl.textContent = isRepeat ? '单句循环：开' : '单句循环：关';
  if (isRepeat && activeIndex >= 0) {
    // 重新从当前句开始循环
    video.currentTime = subtitles[activeIndex].start;
    video.play();
  }
});

playBtn.addEventListener('click', () => {
  if (video.paused) video.play();
  else video.pause();
});

video.addEventListener('play', () => { playBtn.textContent = '⏸ 暂停'; });
video.addEventListener('pause', () => { playBtn.textContent = '▶ 播放'; });

speedSlider.addEventListener('input', () => {
  const v = parseFloat(speedSlider.value);
  video.playbackRate = v;
  speedVal.textContent = v.toFixed(1) + 'x';
});

/* ============ 文件加载 ============ */
document.getElementById('videoFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  video.src = URL.createObjectURL(file);
  statusEl.textContent = '视频已加载';
});

document.getElementById('subFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    subtitles = parseSRT(ev.target.result);
    renderSubtitles();
    activeIndex = -1;
    statusEl.textContent = `字幕加载完成，共 ${subtitles.length} 句`;
  };
  reader.readAsText(file, 'UTF-8');
});

/* ============ 键盘快捷键 ============ */
document.addEventListener('keydown', (e) => {
  // 避免在输入框触发
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

  switch (e.key) {
    case 'ArrowUp':
    case 'ArrowLeft':
      e.preventDefault();
      document.getElementById('prevBtn').click();
      break;
    case 'ArrowDown':
    case 'ArrowRight':
      e.preventDefault();
      document.getElementById('nextBtn').click();
      break;
    case ' ':
      e.preventDefault();
      playBtn.click();
      break;
    case 'r':
    case 'R':
      repeatBtn.click();
      break;
  }
});
 /* ============ 点击单词查词 ============ */
const dictPopup = document.getElementById('dictPopup');
const dictWordEl = document.getElementById('dictWord');
const dictPhoneticEl = document.getElementById('dictPhonetic');
const dictBodyEl = document.getElementById('dictBody');
const addToVocabBtn = document.getElementById('addToVocab');

let currentLookup = null; // 当前查询的单词信息 {word, def}

// 事件委托：点击字幕里的任意单词
subtitleList.addEventListener('click', (e) => {
  const wordEl = e.target.closest('.word');
  if (wordEl) {
    e.stopPropagation(); // 防止触发整句播放
    const word = wordEl.dataset.word;
    lookupWord(word);
    return;
  }
  // 点击非单词区域（整句）仍然逐句播放
  const lineEl = e.target.closest('.line');
  if (lineEl) {
    playSentence(parseInt(lineEl.dataset.index));
  }
});

async function lookupWord(word) {
  currentLookup = { word, def: '' };
  dictWordEl.textContent = word;
  dictPhoneticEl.textContent = '';
  dictBodyEl.innerHTML = '查询中...';
  dictPopup.classList.add('show');

  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    const entry = data[0];

    // 音标
    const phonetic = entry.phonetic || (entry.phonetics?.find(p => p.text)?.text) || '';
    dictPhoneticEl.textContent = phonetic;

    // 释义（取前 3 个）
    let html = '';
    let firstDef = '';
    const meanings = (entry.meanings || []).slice(0, 3);
    meanings.forEach(m => {
      const def = m.definitions?.[0];
      if (!def) return;
      if (!firstDef) firstDef = def.definition;
      html += `<div class="def">
        <span class="pos">${m.partOfSpeech}</span> ${def.definition}`;
      if (def.example) {
        html += `<div class="example">e.g. ${def.example}</div>`;
      }
      html += `</div>`;
    });
    if (!html) html = '<div class="def">未找到释义</div>';
    dictBodyEl.innerHTML = html;
    currentLookup.def = firstDef;
  } catch (err) {
    dictBodyEl.innerHTML = '<div class="def">未找到该词，或网络请求失败。</div>';
  }
}

document.getElementById('dictClose').addEventListener('click', () => {
  dictPopup.classList.remove('show');
});

/* ============ 生词本（localStorage） ============ */
const VOCAB_KEY = 'en_vocab_list';

function getVocab() {
  try { return JSON.parse(localStorage.getItem(VOCAB_KEY)) || []; }
  catch { return []; }
}
function saveVocab(list) {
  localStorage.setItem(VOCAB_KEY, JSON.stringify(list));
}

addToVocabBtn.addEventListener('click', () => {
  if (!currentLookup) return;
  const list = getVocab();
  if (list.some(v => v.word === currentLookup.word)) {
    addToVocabBtn.textContent = '✓ 已在生词本';
    setTimeout(() => addToVocabBtn.textContent = '＋ 加入生词本', 1200);
    return;
  }
  list.push({
    word: currentLookup.word,
    def: currentLookup.def,
    time: Date.now()
  });
  saveVocab(list);
  renderVocab();
  addToVocabBtn.textContent = '✓ 已加入';
  setTimeout(() => addToVocabBtn.textContent = '＋ 加入生词本', 1200);
});

/* ============ 生词本面板渲染 ============ */
const vocabPanel = document.getElementById('vocabPanel');
const vocabList = document.getElementById('vocabList');
const vocabCount = document.getElementById('vocabCount');

function renderVocab() {
  const list = getVocab();
  vocabCount.textContent = list.length;
  if (list.length === 0) {
    vocabList.innerHTML = '<div style="color:#666;font-size:13px;padding:8px;">还没有生词，点击字幕中的单词加入吧。</div>';
    return;
  }
  vocabList.innerHTML = list.map((v, i) => `
    <div class="vocab-item">
      <span class="v-word">${escapeHtml(v.word)}</span>
      <span class="v-def">${escapeHtml(v.def || '')}</span>
      <button class="v-del" data-i="${i}">🗑</button>
    </div>
  `).join('');
}

vocabList.addEventListener('click', (e) => {
  const delBtn = e.target.closest('.v-del');
  if (delBtn) {
    const list = getVocab();
    list.splice(parseInt(delBtn.dataset.i), 1);
    saveVocab(list);
    renderVocab();
  }
});

document.getElementById('vocabClose').addEventListener('click', () => {
  vocabPanel.classList.remove('show');
});

/* ============ 打开生词本按钮 ============ */
// 在底部 controls 里加一个按钮，这里动态创建，省得你改 HTML
(function addVocabBtnToControls() {
  const controls = document.querySelector('.controls');
  const btn = document.createElement('button');
  btn.textContent = '📚 生词本';
  btn.addEventListener('click', () => {
    renderVocab();
    vocabPanel.classList.toggle('show');
  });
  controls.insertBefore(btn, controls.querySelector('.status'));
})();

// 页面加载时初始化生词本计数
renderVocab();
</script>
</body>
</html>
